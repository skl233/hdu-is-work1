name: Secure API CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest -v

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit
      - name: Static analysis of application code
        run: |
          # Human readable report (the gate is applied separately below).
          bandit -r app -ll -ii -f txt -o bandit-report.txt || true
          cat bandit-report.txt
          # Full JSON report: source of truth for the gate and for the SARIF file.
          # NOTE: this Bandit version has no native `-f sarif`, so the SARIF
          # document is produced by scripts/bandit_to_sarif.py from this JSON.
          bandit -r app -f json -o bandit-report.json --exit-zero
      - name: Convert Bandit JSON to SARIF
        run: python scripts/bandit_to_sarif.py bandit-report.json bandit.sarif
      - name: Apply the security gate
        run: |
          python - <<'PY'
          import json, sys
          with open("bandit-report.json", encoding="utf-8") as fh:
              report = json.load(fh)
          # B105 (hardcoded password) on the demo seeds is a teaching fixture and
          # is annotated with # nosec, so Bandit already excludes it.
          blocking = [r for r in report.get("results", [])
                      if r["issue_severity"] in ("MEDIUM", "HIGH")
                      and r["issue_confidence"] in ("MEDIUM", "HIGH")]
          print(f"Bandit findings (all): {len(report.get('results', []))}")
          print(f"Bandit blocking findings (medium/high severity+confidence): {len(blocking)}")
          for r in blocking:
              print(f"  {r['filename']}:{r['line_number']} [{r['issue_severity']}] "
                    f"{r['test_id']} {r['issue_text']}")
          sys.exit(1 if blocking else 0)
          PY
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: |
            bandit-report.txt
            bandit-report.json
            bandit.sarif
      - name: Publish results to GitHub Security tab
        if: always() && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r requirements.txt
      - name: Audit third-party dependencies
        run: |
          pip-audit -r requirements.txt --strict --format json --output pip-audit-report.json
          pip-audit -r requirements.txt
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
